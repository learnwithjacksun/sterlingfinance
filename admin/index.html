<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Sterling Holdings provides secure and innovative banking solutions, including savings accounts, loans, and investment opportunities tailored to your needs." />
    <meta name="keywords" content="financial bank, online banking, loans, savings, investment, secure banking, Sterling Holdings" />
    <meta name="author" content="Sterling Holdings" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Sterling Holdings - Admin Panel</title>

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="Sterling Holdings - Admin Panel" />
    <meta property="og:description" content="Experience reliable banking with Sterling Holdings. Get loans, savings, and investment options tailored for you." />
    <meta property="og:url" content="https://www.truemfb.com" />
    <meta property="og:image" content="https://www.truemfb.com/assets/bank-preview.jpg" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sterling Holdings - Admin Panel" />
    <meta name="twitter:description" content="Experience reliable banking with Sterling Holdings. Get loans, savings, and investment options tailored for you." />
    <meta name="twitter:image" content="https://www.truemfb.com/assets/bank-preview.jpg" />
    <meta name="twitter:site" content="@TrueMarkBank" />

    <!-- Structured Data (Schema Markup for Banks) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BankOrCreditUnion",
      "name": "Sterling Holdings",
      "url": "https://www.truemfb.com",
      "logo": "https://www.truemfb.com/logo.png",
      "description": "Sterling Holdings provides secure and innovative banking solutions, including savings accounts, loans, and investment opportunities tailored to your needs.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Financial St",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "postalCode": "10001",
        "addressCountry": "USA"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-800-555-0199",
        "contactType": "Customer Service",
        "availableLanguage": ["English", "Spanish"]
      },
      "openingHours": "Mo-Fr 09:00-17:00",
      "sameAs": [
        "https://www.facebook.com/TrueMarkBank",
        "https://twitter.com/TrueMarkBank",
        "https://www.linkedin.com/company/truemarkbank"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
